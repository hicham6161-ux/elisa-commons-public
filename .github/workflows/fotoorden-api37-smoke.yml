name: Test FotoOrden IA 0.3 on Android 17
on:
  push:
    branches: [fotoorden-ia-v03-safe-20261109]
    paths: ['.github/workflows/fotoorden-api37-smoke.yml']
  workflow_dispatch:
jobs:
  api37:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch current APK
        shell: bash
        run: |
          curl -fsSL --retry 3 'https://raw.githubusercontent.com/hicham6161-ux/elisa-commons-public/fotoorden-ia-v03-safe-20261109/FotoOrdenIA_v0_3_Safe.apk' -o /tmp/fotoorden.apk
          echo '67097462ec0103a781daa61eec3eb48a6c9a3118e92fd1a9a82220ace584a770  /tmp/fotoorden.apk' | sha256sum -c -
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Create smoke test script
        shell: bash
        run: |
          cat > /tmp/testfotoorden.sh <<'SCRIPT'
          #!/bin/bash
          set -euo pipefail
          adb install -r /tmp/fotoorden.apk
          adb logcat -c
          adb shell am start -W -n com.eian.fotoorden/.SafeLauncherActivity
          sleep 5
          echo "API LEVEL: $(adb shell getprop ro.build.version.sdk)"
          adb shell pidof com.eian.fotoorden
          adb shell uiautomator dump /sdcard/window.xml >/dev/null
          adb pull /sdcard/window.xml /tmp/view.xml >/dev/null
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          import re, subprocess
          root = ET.parse('/tmp/view.xml').getroot()
          matching=[node for node in root.iter('node') if node.attrib.get('text')=='Abrir mi galería']
          assert matching, 'Missing open-gallery button'
          box=matching[0].attrib.get('bounds','')
          a,b,c,d=map(int,re.findall(r'\d+',box))
          subprocess.run(['adb','shell','input','tap',str((a+c)//2),str((b+d)//2)],check=True)
          print('Clicked gallery button',box)
          PY
          sleep 6
          adb shell pidof com.eian.fotoorden
          if adb logcat -b crash -d -v brief | grep -A 20 'FATAL EXCEPTION' | grep -q 'Process: com.eian.fotoorden'; then
             adb logcat -b crash -d -v time
             exit 1
          fi
          adb shell dumpsys activity activities | grep -E 'topResumedActivity|com.eian.fotoorden' | head -n 18
          SCRIPT
          chmod +x /tmp/testfotoorden.sh
      - name: Emulator Android 17
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 37
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: bash /tmp/testfotoorden.sh
