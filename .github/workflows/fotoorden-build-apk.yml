name: Compilar FotoOrden IA Android
on:
  push:
    branches: [fotoorden-ia-android-build-20261109]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout build
        uses: actions/checkout@v4
      - name: Download FotoOrden source and verify SHA-256
        shell: bash
        run: |
          curl -fsSL --retry 3 'https://e9c82238-9ab8-4e1d-8080-11ec47c88a15.sandbox.floot.app/_cdn/static/b3b6e1fa-c6e0-4892-bd9b-f2daa6e9afc5-FotoOrdenIA_Android_v0_1_beta.zip' -o source.zip
          echo '6e534592aa3bf512162101f305baf596aabd83172e5c5efafc0eaca4dc9a2d1d  source.zip' | sha256sum -c -
          unzip -q source.zip
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - name: Install Android 35 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        working-directory: FotoOrdenIA_Android
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Upload installable APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FotoOrdenIA-Android-APK
          path: FotoOrdenIA_Android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Publicar APK listo para instalar
        if: success()
        shell: bash
        run: |
          cp FotoOrdenIA_Android/app/build/outputs/apk/debug/app-debug.apk FotoOrdenIA.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f FotoOrdenIA.apk
          git commit -m "release: FotoOrden IA APK compilado"
          git push origin HEAD:refs/heads/fotoorden-ia-android-build-20261109
