name: Build and smoke-test FotoOrden IA v0.3 Safe
on:
  push:
    branches: [fotoorden-ia-v03-safe-20261109]
    paths: ['.github/workflows/fotoorden-v03-safe.yml']
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repair project
        uses: actions/checkout@v4
      - name: Download verified FotoOrden v0.2 source and apply safe-mode patch
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 'https://e9c82238-9ab8-4e1d-8080-11ec47c88a15.sandbox.floot.app/_cdn/static/b3b6e1fa-c6e0-4892-bd9b-f2daa6e9afc5-FotoOrdenIA_Android_v0_1_beta.zip' -o source.zip
          echo '6e534592aa3bf512162101f305baf596aabd83172e5c5efafc0eaca4dc9a2d1d  source.zip' | sha256sum -c -
          curl -fsSL --retry 3 'https://e9c82238-9ab8-4e1d-8080-11ec47c88a15.sandbox.floot.app/_cdn/static/6ac92e2d-c2c5-4c8d-a69e-d866f139c23a-FotoOrdenIA_DriveBridge_Addon_v0_2.zip' -o addon.zip
          echo 'c0ea12d1700f248adb2b8b59a5bae6283855f745707117bd40a77e3a92400553  addon.zip' | sha256sum -c -
          unzip -q source.zip
          unzip -q addon.zip
          python3 fotoorden_addon/install_addon.py
          python3 safe/patch.py
          grep 'android:name=".SafeLauncherActivity"' FotoOrdenIA_Android/app/src/main/AndroidManifest.xml
          grep 'versionCode = 3' FotoOrdenIA_Android/app/build.gradle.kts
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile APK
        working-directory: FotoOrdenIA_Android
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Emulator smoke test Android 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb install -r FotoOrdenIA_Android/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n com.eian.fotoorden/.SafeLauncherActivity
            sleep 6
            adb shell pidof com.eian.fotoorden
            adb shell dumpsys activity activities | grep 'topResumedActivity.*com.eian.fotoorden/.SafeLauncherActivity'
            test -z "$(adb logcat -b crash -d -v brief | grep -A 15 'FATAL EXCEPTION' | grep 'Process: com.eian.fotoorden')" 
      - name: Upload tested APK
        uses: actions/upload-artifact@v4
        with:
          name: FotoOrdenIA-v0.3-Safe-APK
          path: FotoOrdenIA_Android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Publish direct-download APK
        shell: bash
        run: |
          cp FotoOrdenIA_Android/app/build/outputs/apk/debug/app-debug.apk FotoOrdenIA_v0_3_Safe.apk
          sha256sum FotoOrdenIA_v0_3_Safe.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f FotoOrdenIA_v0_3_Safe.apk
          git commit -m 'release: FotoOrden IA v0.3 safe crash-report APK'
          git push origin HEAD:refs/heads/fotoorden-ia-v03-safe-20261109
