name: ELISA public synthetic CPU inference probe
on:
  push:
    branches: [elisa-cloud-smoke-20261029]
    paths:
      - '.github/workflows/elisa-cloud-smoke-20261029.yml'
      - 'cloud-smoke-20261029/probe.py'
permissions:
  contents: read
jobs:
  cpu-inference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free CPU runtime
        run: |
          python -m pip install --disable-pip-version-check 'torch==2.6.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check 'transformers==4.49.0' 'safetensors>=0.4.3,<1'
      - name: Run two synthetic local CPU model calls
        run: python cloud-smoke-20261029/probe.py
      - name: Preserve public synthetic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elisa-cloud-synthetic-probe-evidence
          path: cloud_smoke_artifacts/
          if-no-files-found: warn
          retention-days: 1
